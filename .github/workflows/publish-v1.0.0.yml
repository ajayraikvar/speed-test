name: Publish Speed Test v1.0.0

on:
  push:
    branches: [main]
    paths:
      - 'release-staging/part-*.txt'

permissions:
  contents: write

concurrency:
  group: speed-test-v1-0-0-publish
  cancel-in-progress: false

jobs:
  publish-v1-0-0:
    runs-on: windows-latest
    steps:
      - name: Check out staged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true

      - name: Restore source tree and prepare v1.0.0
        shell: pwsh
        run: |
          $fullLicense = [System.IO.File]::ReadAllText((Join-Path $PWD 'LICENSE'))
          $parts = @(Get-ChildItem -LiteralPath 'release-staging' -Filter 'part-*.txt' -File | Sort-Object Name)
          if ($parts.Count -ne 10) { throw "Expected 10 source bundle chunks; found $($parts.Count)." }
          $segments = @()
          foreach ($part in $parts) { $segments += [regex]::Replace([System.IO.File]::ReadAllText($part.FullName), '\s', '') }
          $encoded = [string]::Join('', $segments)
          if ($encoded.Length -ne 48968) { throw "Unexpected source archive base64 length: $($encoded.Length)." }
          $archiveBytes = [Convert]::FromBase64String($encoded)
          $sha = [BitConverter]::ToString([Security.Cryptography.SHA256]::Create().ComputeHash($archiveBytes)).Replace('-', '').ToLowerInvariant()
          if ($sha -ne '028d9a4221bcb5328b520de53bb839287c6e11baa3f99f4acdb705eed01c0778') { throw "Source archive SHA256 mismatch: $sha" }

          $archivePath = Join-Path $env:RUNNER_TEMP 'speed-test-source.zip'
          [System.IO.File]::WriteAllBytes($archivePath, $archiveBytes)
          $extractRoot = Join-Path $env:RUNNER_TEMP 'speed-test-source'
          Expand-Archive -LiteralPath $archivePath -DestinationPath $extractRoot -Force
          $sourceRoot = Join-Path $extractRoot 'Speed-Test'
          if (-not (Test-Path -LiteralPath (Join-Path $sourceRoot 'main.go') -PathType Leaf)) { throw 'Source archive did not contain the Go application.' }
          Get-ChildItem -LiteralPath $sourceRoot -Force | ForEach-Object {
            Copy-Item -LiteralPath $_.FullName -Destination $PWD -Recurse -Force
          }
          [System.IO.File]::WriteAllText((Join-Path $PWD 'LICENSE'), $fullLicense, [System.Text.UTF8Encoding]::new($false))
          if (Test-Path -LiteralPath '.github/workflows/publish-v1.0.0.yml') {
            Remove-Item -LiteralPath '.github/workflows/publish-v1.0.0.yml' -Force
          }
          if (Test-Path -LiteralPath 'release-staging') {
            Remove-Item -LiteralPath 'release-staging' -Recurse -Force
          }
          Set-Content -LiteralPath 'VERSION' -Value '1.0.0' -Encoding ascii
          $releaseWorkflow = '.github/workflows/release.yml'
          if (Test-Path -LiteralPath $releaseWorkflow) {
            $releaseText = [System.IO.File]::ReadAllText((Join-Path $PWD $releaseWorkflow))
            $releaseText = $releaseText.Replace("  verify:`n", "  verify:`n    if: github.ref_name != 'v1.0.0'`n")
            $releaseText = $releaseText.Replace("  release-windows:`n", "  release-windows:`n    if: github.ref_name != 'v1.0.0'`n")
            [System.IO.File]::WriteAllText((Join-Path $PWD $releaseWorkflow), $releaseText, [System.Text.UTF8Encoding]::new($false))
          }
          $readmePath = Join-Path $PWD 'README.md'
          $readme = [System.IO.File]::ReadAllText($readmePath)
          $readme = $readme -replace '(?s)## Project status.*?\n---', "## Project status`n`nVersion 1.0.0 is the initial public release. Automated Go tests, race checks, static checks, the Windows build, and a Windows-runner launcher smoke test are run by GitHub Actions. A physical Windows-to-Windows LAN test has not yet been independently confirmed; validate your own network before production use.`n`n---"
          [System.IO.File]::WriteAllText($readmePath, $readme, [System.Text.UTF8Encoding]::new($false))
          @'
# Test status — v1.0.0

| Check | Result |
|---|---|
| Go unit tests | PASS in GitHub Actions |
| Go vet | PASS in GitHub Actions |
| Go race detector | PASS in GitHub Actions |
| Browser JavaScript syntax | PASS in GitHub Actions |
| Windows x64 build | PASS in GitHub Actions |
| PowerShell launcher and local HTTP smoke test | RUN in GitHub Windows runner |
| Actual Windows-to-Windows LAN test on separate physical PCs | PENDING independent user validation |

## Measurement limits

The browser edition measures HTTP/TCP throughput and HTTP round-trip latency. It does not measure raw ICMP ping or UDP packet loss. Browser-based measurements include browser and application overhead.

## Release note

This is the initial public v1.0.0 release. Automated CI and Windows-runner checks are performed, but a separate physical two-PC LAN test has not been independently confirmed. Do not treat the software as a calibrated network certification instrument.
'@ | Set-Content -LiteralPath 'TEST-STATUS.md' -Encoding utf8
          @'
# Changelog

## 1.0.0 — Initial public release

- Self-hosted Windows host with browser-only clients.
- HTTP/TCP download and upload throughput tests.
- HTTP round-trip latency and jitter estimates.
- Live throughput graph.
- Host-side JSONL test history and loopback-only admin dashboard.
- Optional client JSON and CSV report downloads.
- Windows BAT launcher with configurable host port.
- GitHub latest-release update check with SHA-256 verification.
- Offline startup from bundled executable or previously installed version.
- Original author attribution: Ajay Raikvar.
'@ | Set-Content -LiteralPath 'CHANGELOG.md' -Encoding utf8
          New-Item -ItemType Directory -Force -Path 'dist' | Out-Null

      - name: Run source tests and static checks
        shell: pwsh
        run: |
          go test ./...
          go vet ./...
          go test -race ./...
          node --check web/app.js
          node --check web/admin.js

      - name: Build Windows executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'dist/package' | Out-Null
          go build -trimpath -ldflags "-s -w -X main.appVersion=1.0.0" -o 'dist/package/speed-test.exe' .
          Copy-Item 'dist/package/speed-test.exe' 'speed-test.exe' -Force

      - name: Test PowerShell launcher on Windows
        shell: pwsh
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP 'speed-test-launcher.stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'speed-test-launcher.stderr.log'
          $launcher = Join-Path $PWD 'Start-Speed-Test.ps1'
          $process = Start-Process -FilePath 'powershell.exe' -ArgumentList @('-NoLogo','-NoProfile','-ExecutionPolicy','Bypass','-File',$launcher,'-Port','19876') -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $ready = $false
            for ($i = 0; $i -lt 40; $i++) {
              try {
                $info = Invoke-RestMethod -Uri 'http://127.0.0.1:19876/api/info' -TimeoutSec 2
                if ($info.version -eq '1.0.0') { $ready = $true; break }
              } catch { Start-Sleep -Milliseconds 500 }
            }
            if (-not $ready) {
              if (Test-Path $stdout) { Get-Content $stdout }
              if (Test-Path $stderr) { Get-Content $stderr }
              throw 'PowerShell launcher did not start a v1.0.0 host on the smoke-test port.'
            }
          } finally {
            Get-Process -Name 'speed-test' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
            Remove-Item -LiteralPath 'speed-test.exe' -Force -ErrorAction SilentlyContinue
          }

      - name: Assemble Windows offline package
        shell: pwsh
        run: |
          Copy-Item 'Start-Speed-Test.bat', 'Start-Speed-Test.ps1', 'README.md', 'LICENSE', 'NOTICE', 'CHANGELOG.md', 'TEST-STATUS.md' -Destination 'dist/package'
          Compress-Archive -Path 'dist/package/*' -DestinationPath 'dist/Speed-Test-Windows-x64.zip' -Force

      - name: Commit full source tree
        id: commit
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish Speed Test v1.0.0 source'
          git push origin HEAD:main
          $sha = (git rev-parse HEAD).Trim()
          "sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Create source archive and checksums
        shell: pwsh
        run: |
          git archive --format=zip --output='dist/Speed-Test-Source-v1.0.0.zip' HEAD
          $windowsHash = (Get-FileHash -Algorithm SHA256 'dist/Speed-Test-Windows-x64.zip').Hash.ToLowerInvariant()
          $sourceHash = (Get-FileHash -Algorithm SHA256 'dist/Speed-Test-Source-v1.0.0.zip').Hash.ToLowerInvariant()
          @("$windowsHash  Speed-Test-Windows-x64.zip", "$sourceHash  Speed-Test-Source-v1.0.0.zip") | Set-Content -LiteralPath 'dist/SHA256SUMS.txt' -Encoding ascii

      - name: Publish GitHub Release v1.0.0
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v1.0.0
          target_commitish: ${{ steps.commit.outputs.sha }}
          name: Speed Test v1.0.0
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            Initial public release of Speed Test by Ajay Raikvar.

            **Windows host:** download Speed-Test-Windows-x64.zip, extract it, and run Start-Speed-Test.bat. Other PCs connect in a modern browser.

            **Offline use:** the Windows ZIP contains the server executable and launcher. No internet connection is required for a first run from this complete package.

            **Integrity:** verify Speed-Test-Windows-x64.zip against SHA256SUMS.txt.

            **Validation disclosure:** automated source checks and a Windows-runner launcher smoke test are part of this workflow. A separate physical Windows-to-Windows LAN test remains pending independent user validation. Browser measurements are HTTP/TCP throughput and HTTP round-trip latency, not raw ICMP ping or UDP packet loss.

            © 2026 Ajay Raikvar — https://www.ajayraikvar.com
          files: |
            dist/Speed-Test-Windows-x64.zip
            dist/Speed-Test-Source-v1.0.0.zip
            dist/SHA256SUMS.txt
