name: Publish Speed Test v2.1.0

on:
  push:
    branches:
      - release/v2.1.0
    paths:
      - '.github/workflows/publish-v2.1.0.yml'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'VERSION'
      - 'TEST-STATUS.md'
      - 'Start-Speed-Test.ps1'
      - 'web/style.css'
      - 'web/admin.css'
      - 'web/admin.html'

permissions:
  contents: write

concurrency:
  group: speed-test-v2-1-0-publish
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: release/v2.1.0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Go unit tests
        run: go test ./...
      - name: Go vet
        run: go vet ./...
      - name: Go race detector
        run: go test -race ./...
      - name: Browser JavaScript syntax
        run: |
          node --check web/app.js
          node --check web/admin.js

  package-and-publish:
    needs: verify
    runs-on: windows-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: release/v2.1.0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build Windows and source packages
        shell: pwsh
        run: |
          ./scripts/build-package.ps1 -Version '2.1.0'
          if ($LASTEXITCODE -ne 0) { throw 'Release package build failed.' }
      - name: Publish GitHub Release v2.1.0
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v2.1.0
          target_commitish: release/v2.1.0
          name: Speed Test v2.1.0
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            Speed Test v2.1.0 by Ajay Raikvar.

            **What's new:** A modern responsive UI for the main Speed Test page and host dashboard, with clearer test controls, live results, diagnostics, client comparison and history views. Existing JavaScript behavior and the HTTP/TCP measurement method are unchanged.

            **Windows x64:** Download `Speed-Test-Windows-x64.zip`, extract it, and run `Start-Speed-Test.bat`. Other LAN devices connect through a modern browser.

            **Source:** `Speed-Test-v2.1.0-Source.zip` contains the corresponding source tree.

            **Integrity:** Verify both ZIP packages using `SHA256SUMS.txt`.

            **Validation:** The workflow runs Go unit tests, vet, the race detector, JavaScript syntax checks, and a Windows x64 package build. Browser visual/end-to-end checks and a physical Windows-to-Windows LAN test still require independent validation.

            **Security notice:** This UI refresh does not add admin login or authentication. Keep the host on a trusted private LAN, restrict its port with Windows Firewall, and do not expose it to the public internet or configure router port forwarding.

            **Measurement limits:** Throughput and latency are measured over HTTP/TCP. This is not raw ICMP ping or UDP packet-loss measurement, and it is not a calibrated network certification instrument.

            © 2026 Ajay Raikvar — https://www.ajayraikvar.com
          files: |
            dist/v2.1.0/Speed-Test-Windows-x64.zip
            dist/v2.1.0/Speed-Test-v2.1.0-Source.zip
            dist/v2.1.0/SHA256SUMS.txt
